services:
  - type: web
    name: dialectic-api
    runtime: python
    python: "3.11"
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: yes
    envVars:
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: dialectic
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/out
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    autoDeploy: yes
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
