services:
  - type: web
    name: dialectic
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/rtms/webhook
    envVars:
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
      # RTMS Credentials
      - key: ZM_RTMS_CLIENT
        sync: false
      - key: ZM_RTMS_SECRET
        sync: false
      # Optional: Webhook secret for validation
      - key: ZOOM_WEBHOOK_SECRET
        sync: false