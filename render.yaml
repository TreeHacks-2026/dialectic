services:
  - type: web
    name: dialectic
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=@dialectic/transcript-service && npm run build --workspace=@dialectic/transcript-service && npm run build
    startCommand: npm start
    healthCheckPath: /api/courses
    envVars:
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: HEYGEN_API_KEY
        sync: false
