<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcript Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        h1 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #666;
            display: inline-block;
        }
        .status-indicator.connected {
            background: #4CAF50;
            box-shadow: 0 0 8px #4CAF50;
        }
        .status-indicator.disconnected {
            background: #f44336;
        }
        .status-text {
            color: #999;
        }
        .transcript-container {
            background: #252525;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            max-height: 500px;
            overflow-y: auto;
        }
        .transcript-item {
            margin-bottom: 15px;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 4px;
            border-left: 3px solid #4CAF50;
        }
        .speaker-name {
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        .transcript-text {
            color: #e0e0e0;
        }
        .empty-state {
            text-align: center;
            color: #666;
            padding: 40px;
        }
        .info-box {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            border-left: 4px solid #2196F3;
        }
        .info-box h3 {
            color: #2196F3;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Transcript Service</h1>
            <div class="status-bar">
                <span class="status-indicator" id="statusIndicator"></span>
                <span class="status-text" id="statusText">Disconnected</span>
            </div>
        </header>

        <div class="info-box">
            <h3>ℹ️ Service Status</h3>
            <p>This app displays real-time meeting transcripts from Zoom RTMS.</p>
            <p style="margin-top: 10px; font-size: 0.9em; color: #999;">
                Status: <span id="connectionStatus">Checking...</span>
            </p>
        </div>

        <div class="transcript-container">
            <div id="transcriptList">
                <div class="empty-state">
                    <p>Waiting for meeting transcripts...</p>
                    <p style="margin-top: 10px; font-size: 0.9em;">Start speaking in the meeting to see transcripts here.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const connectionStatus = document.getElementById('connectionStatus');
        const transcriptList = document.getElementById('transcriptList');

        // Check connection status
        async function checkStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                
                if (data.connected) {
                    statusIndicator.className = 'status-indicator connected';
                    statusText.textContent = 'Connected';
                    connectionStatus.textContent = `Connected (Session: ${data.session_id || 'N/A'})`;
                } else {
                    statusIndicator.className = 'status-indicator disconnected';
                    statusText.textContent = 'Disconnected';
                    // Provide helpful message about why it's disconnected
                    connectionStatus.innerHTML = `
                        <div style="margin-top: 10px; font-size: 0.9em; color: #ff9800;">
                            <strong>⚠️ RTMS Not Connected</strong><br>
                            <div style="margin-top: 5px; font-size: 0.85em; color: #999;">
                                Waiting for <code>meeting.rtms_started</code> event from Zoom.<br>
                                <strong>To fix:</strong><br>
                                1. Subscribe to <code>meeting.rtms_started</code> in Zoom App Marketplace<br>
                                2. Enable RTMS in Zoom Desktop Settings → Zoom Apps<br>
                                3. Start the app in your meeting
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                statusIndicator.className = 'status-indicator disconnected';
                statusText.textContent = 'Error';
                connectionStatus.textContent = 'Unable to check status';
            }
        }

        // Check status every 2 seconds
        checkStatus();
        setInterval(checkStatus, 2000);

        // WebSocket connection for real-time updates
        let ws = null;
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    console.log('WebSocket connected');
                };
                
                ws.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        
                        // Handle different message types (matching reference implementation)
                        switch (message.type) {
                            case 'connected':
                                console.log('Connected to server:', message.message);
                                break;
                            
                            case 'meeting_started':
                                console.log('Meeting RTMS stream started');
                                // Update status to connected
                                statusIndicator.className = 'status-indicator connected';
                                statusText.textContent = 'Connected';
                                connectionStatus.textContent = `Connected (Session: ${message.streamId || 'N/A'})`;
                                break;
                            
                            case 'meeting_stopped':
                                console.log('Meeting RTMS stream stopped');
                                // Update status to disconnected
                                statusIndicator.className = 'status-indicator disconnected';
                                statusText.textContent = 'Disconnected';
                                connectionStatus.textContent = 'Meeting RTMS stream has stopped';
                                break;
                            
                            case 'transcript':
                                addTranscript(message.speaker_name, message.text, message.is_final);
                                break;
                            
                            default:
                                console.log('Unknown message type:', message.type);
                        }
                    } catch (error) {
                        console.error('Error parsing message:', error);
                    }
                };
                
                ws.onclose = () => {
                    console.log('WebSocket disconnected, reconnecting...');
                    setTimeout(connectWebSocket, 3000);
                };
                
                ws.onerror = (error) => {
                    console.error('WebSocket error:', error);
                };
            } catch (error) {
                console.error('Failed to create WebSocket:', error);
            }
        }

        // Add transcript to the list
        function addTranscript(speaker, text, isFinal) {
            if (transcriptList.querySelector('.empty-state')) {
                transcriptList.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'transcript-item';
            item.innerHTML = `
                <div class="speaker-name">${speaker || 'Unknown'}</div>
                <div class="transcript-text">${text}</div>
            `;
            
            transcriptList.appendChild(item);
            transcriptList.scrollTop = transcriptList.scrollHeight;
        }

        // Try to connect WebSocket (will fail if server doesn't support it, that's ok)
        connectWebSocket();
    </script>
</body>
</html>
