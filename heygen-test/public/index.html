<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyGen Avatar - Text to Speech</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎭 HeyGen Avatar</h1>
            <p class="subtitle">Type text and watch it come to life</p>
        </header>

        <main>
            <div class="avatar-card">
                <div class="avatar-container" id="avatar-container">
                    <video id="avatar-video" autoplay playsinline></video>
                    <div class="placeholder" id="placeholder">
                        <div class="placeholder-icon">🎬</div>
                        <p>Click "Start Session" to begin</p>
                    </div>
                </div>
                <div class="status-badge" id="status-badge">
                    <span class="status-dot"></span>
                    <span class="status-text">Disconnected</span>
                </div>
            </div>

            <div class="controls-card">
                <div class="input-group">
                    <textarea 
                        id="text-input" 
                        placeholder="Type something for the avatar to say..."
                        rows="3"
                    ></textarea>
                </div>

                <div class="button-group">
                    <button id="start-btn" class="btn btn-primary">
                        <span class="btn-icon">▶️</span>
                        Start Session
                    </button>
                    <button id="speak-btn" class="btn btn-secondary" disabled>
                        <span class="btn-icon">💬</span>
                        Speak
                    </button>
                    <button id="stop-btn" class="btn btn-danger" disabled>
                        <span class="btn-icon">⏹️</span>
                        Stop
                    </button>
                </div>

                <div class="info-text">
                    Press <kbd>Enter</kbd> to speak, or <kbd>Shift+Enter</kbd> for new line
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by HeyGen Streaming Avatar SDK</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
